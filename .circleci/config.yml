version: 2.1

workflows:
  version: 2
  build-deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main

jobs:
  build:
    working_directory: ~/example_application
    docker:
      - image: cimg/node:20.18.0
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: install-dependencies
          command: npm install
      - run:
          name: docker-login
          command: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      - run:
          name: Build and Push Docker Image
          command: |
            # This builds the image locally in CircleCI
            docker build -t $DOCKER_USERNAME/$IMAGE_NAME:latest .
            # This pushes it to your Hub (eskandaratrak/devops_ca)
            docker push $DOCKER_USERNAME/$IMAGE_NAME:latest

  deploy:
    docker:
      - image: cimg/node:20.18.0
    steps:
      - add_ssh_keys:
          fingerprints:
            - "PASTE_YOUR_SSH_FINGERPRINT_HERE"
      - run:
          name: deploy-application
          command: |
            ssh -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_PUBLIC_DNS "
              echo \"$DOCKER_PASSWORD\" | sudo docker login -u \"$DOCKER_USERNAME\" --password-stdin && \
              sudo docker pull \"$DOCKER_USERNAME/$IMAGE_NAME:latest\" && \
              sudo docker stop example_app || true && \
              sudo docker rm example_app || true && \
              sudo docker run -d \
                --name example_app \
                -p 8443:8443 \
                -e SERVER=\"$SERVER\" \
                -e PRIVATE_KEY=\"$PRIVATE_KEY\" \
                \"$DOCKER_USERNAME/$IMAGE_NAME:latest\"
            "