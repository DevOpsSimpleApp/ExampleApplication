version: 2.1

workflows:
  version: 2
  build-deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main

jobs:
  build:
    working_directory: ~/ExampleApplication
    docker:
      - image: cimg/node:20.10.0 # Updated to match your current working Node 20
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: npm install

  deploy:
    docker:
      - image: cimg/node:20.10.0
    steps:
      - run:
          name: Deploy to EC2 via SSH
          command: |
            ssh -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_PUBLIC_DNS << 'EOF'
              cd ~/ExampleApplication
              git pull origin main
              npm install
              
              # Ensure the SSL keys exist in the bin folder for the app to start
              cd bin
              if [ ! -f server.crt ]; then
                openssl req -x509 -newkey rsa:4096 -keyout server.key -out server.crt -days 365 -nodes -subj "/C=US/ST=State/L=City/O=Organization/CN=localhost"
                cp server.key privatekey.pem
                cp server.crt certificate.pem
              fi
              
              # Restart the app with PM2
              pm2 restart example_app || pm2 start www --name example_app
            EOF