version: 2.1

workflows:
  version: 2
  build-deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
      - deploy:
          requires:
            - build
          filters:
            branches:
              only:
                - main

jobs:
  build:
    working_directory: ~/example_application
    docker:
      - image: cimg/node:20.10.0
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14
      - run:
          name: update-npm
          command: 'sudo npm install -g npm@latest'
      - restore_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
      - run:
          name: install-npm-wee
          command: npm install
      - save_cache:
          key: dependency-cache-{{ checksum "package-lock.json" }}
          paths:
            - ./node_modules
      - run:
          name: test-run
          command: npm run test || true
      - run:
          name: docker-login
          command: docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
      - run:
          name: Build Docker Image
          command: docker build -t $DOCKER_USERNAME/$IMAGE_NAME:latest .
      - run:
          name: Publish Docker Image
          command: docker push $DOCKER_USERNAME/$IMAGE_NAME:latest

  deploy:
    docker:
      - image: cimg/node:20.10.0
    steps:
      - add_ssh_keys:
          fingerprints:
            - "PASTE_YOUR_SSH_FINGERPRINT_HERE"
      - run:
          name: deploy-application
          command: |
            ssh -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_PUBLIC_DNS "
              sudo docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD && \
              sudo docker pull $DOCKER_USERNAME/$IMAGE_NAME:latest && \
              sudo docker stop example_app || true && \
              sudo docker rm example_app || true && \
              sudo docker run -d \
                --name example_app \
                -p 8443:8443 \
                -e SERVER=\"$SERVER\" \
                -e PRIVATE_KEY=\"$PRIVATE_KEY\" \
                $DOCKER_USERNAME/$IMAGE_NAME:latest
            "